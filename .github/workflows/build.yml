name: Build Rhine Lab UI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: /RhineLabUI-SSH-Desktop/
      - uses: actions/upload-artifact@v4
        with:
          name: rhine-lab-web
          path: dist/
          if-no-files-found: error

  pages:
    name: Publish web preview
    needs: web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/download-artifact@v4
        with:
          name: rhine-lab-web
          path: dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  windows:
    name: Windows desktop build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cache desktop toolchains
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            .tools/ssh-toolchain
          key: desktop-tools-${{ runner.os }}-${{ hashFiles('package-lock.json', 'services/ssh/toolchain.json') }}
      - run: npm ci
      - name: Build Windows desktop
        shell: pwsh
        env:
          ELECTRON_GET_USE_PROXY: 'true'
        run: npm run dist:dir
      - uses: actions/upload-artifact@v4
        with:
          name: rhine-lab-windows-unpacked
          path: release/desktop/win-unpacked/
          if-no-files-found: error

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    env:
      RHINE_GO: /opt/go/bin/go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Go toolchain
        shell: bash
        run: |
          curl --fail --location --retry 3 https://go.dev/dl/go1.27.1.linux-amd64.tar.gz --output /tmp/go1.27.1.linux-amd64.tar.gz
          sudo tar -C /opt -xzf /tmp/go1.27.1.linux-amd64.tar.gz
          echo '/opt/go/bin' >> "$GITHUB_PATH"
          test -x "$RHINE_GO"
          "$RHINE_GO" version
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - run: npm ci
      - name: Ensure Gradle wrapper is executable
        shell: bash
        run: chmod +x android/gradlew
      - run: npm run android:build
      - uses: actions/upload-artifact@v4
        with:
          name: rhine-lab-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
