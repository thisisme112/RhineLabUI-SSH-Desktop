name: Build Rhine Lab UI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: rhine-lab-web
          path: dist/
          if-no-files-found: error

  windows:
    name: Windows desktop build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:dir
      - uses: actions/upload-artifact@v4
        with:
          name: rhine-lab-windows-unpacked
          path: release/desktop/win-unpacked/
          if-no-files-found: error

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - run: npm ci
      - run: npm run android:build
      - uses: actions/upload-artifact@v4
        with:
          name: rhine-lab-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
